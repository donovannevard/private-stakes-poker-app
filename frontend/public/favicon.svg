<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g transform="translate(16 16) scale(1.22) translate(-16 -16)">
    <!-- card, tilted, pushed lower-left so the Q stays clear of the bolt's path -->
    <g transform="rotate(-20 15 18)">
      <rect x="6.5" y="8" width="15" height="21" rx="2.4" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.3" />
      <text x="8.8" y="16.2" font-family="Georgia, 'Times New Roman', serif" font-size="7.6" font-weight="bold" fill="#dc2626">Q</text>
      <text x="8.4" y="24.6" font-family="Georgia, 'Times New Roman', serif" font-size="7.6" fill="#dc2626">&#9829;</text>
    </g>
    <!-- bold lightning bolt striking down into the card from the top-right -->
    <polygon points="30,0 15,15 21,15 14,24 27,10 19,10" fill="#f59e0b" stroke="#78350f" stroke-width="1.4" stroke-linejoin="round" />
  </g>
</svg>
